services:
  postgres:
    image: postgres:16
    container_name: trip_wallet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripwallet
      POSTGRES_PASSWORD: tripwallet_password
      POSTGRES_DB: tripwallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: trip_wallet_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data: